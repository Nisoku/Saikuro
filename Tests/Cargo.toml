[package]
name = "saikuro-tests"
description = "Saikuro test suite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "native"
path = "runners/native.rs"
required-features = ["native"]

[[bin]]
name = "wasi-preview1"
path = "runners/wasi_preview1.rs"
required-features = ["wasi-preview1"]

[[bin]]
name = "wasi-preview2"
path = "runners/wasi_preview2.rs"
required-features = ["wasi-preview2"]

[[bin]]
name = "wasm"
path = "runners/wasm.rs"
required-features = ["wasm"]

[[bin]]
name = "embedded-host"
path = "runners/embedded_host.rs"
required-features = ["embedded"]

[[bin]]
name = "thumbv6m"
path = "runners/bin/thumbv6m.rs"
required-features = ["arm"]

[[bin]]
name = "thumbv7m"
path = "runners/bin/thumbv7m.rs"
required-features = ["arm"]

[[bin]]
name = "thumbv8m"
path = "runners/bin/thumbv8m.rs"
required-features = ["arm"]

[[bin]]
name = "riscv32imc"
path = "runners/bin/riscv32imc.rs"
required-features = ["riscv"]

[[bin]]
name = "riscv32imac"
path = "runners/bin/riscv32imac.rs"
required-features = ["riscv"]

[features]
default = ["native"]
native = [
    "saikuro-core/native",
    "saikuro-event/native",
    "saikuro-schema/native",
    "saikuro-router/native",
    "saikuro-transport/native",
    "saikuro-runtime/native",
    "saikuro-exec/native",
    "saikuro-storage/inmemory",
    "saikuro-random/native",
    "saikuro-event/collector",
    "dep:saikuro",
    "dep:saikuro-c",
    "dep:saikuro-net",
    "dep:saikuro-client",
    "saikuro/native",
    "saikuro-c/native",
    "saikuro-net/native",
    "saikuro-client/native",
]
embedded = [
    "saikuro-core/embedded",
    "saikuro-event/embedded",
    "saikuro-event/collector",
    "saikuro-schema/embedded",
    "saikuro-router/embedded",
    "saikuro-transport/embedded",
    "saikuro-runtime/embedded",
    "saikuro-exec/embedded",
    "saikuro-storage/embedded",
    "saikuro-random/embedded",
    "dep:saikuro-client",
    "saikuro-client/embedded",
]
wasm = [
    "saikuro-core/wasm",
    "saikuro-event/wasm",
    "saikuro-event/collector",
    "saikuro-schema/wasm",
    "saikuro-router/wasm",
    "saikuro-transport/wasm",
    "saikuro-transport/wasm-host",
    "saikuro-runtime/wasm",
    "saikuro-exec/wasm",
    "saikuro-storage/inmemory",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-test",
    "dep:saikuro-client",
    "saikuro-client/wasm",
]
wasi-preview1 = [
    "saikuro-core/no_std",
    "saikuro-event/no_std",
    "saikuro-event/collector",
    "saikuro-schema/no_std",
    "saikuro-router/no_std",
    "saikuro-transport/no_std",
    "saikuro-runtime/no_std",
    "saikuro-runtime/default-panic-handler",
    "saikuro-runtime/wasi-tcp",
    "saikuro-runtime/wasi-preview1",
    "saikuro-exec/no_std",
    "saikuro-random/no_std",
    "dep:saikuro-client",
    "saikuro-client/no_std",
]
wasi-preview2 = [
    "saikuro-core/no_std",
    "saikuro-event/no_std",
    "saikuro-event/collector",
    "saikuro-schema/no_std",
    "saikuro-router/no_std",
    "saikuro-transport/no_std",
    "saikuro-runtime/no_std",
    "saikuro-runtime/wasi-tcp",
    "saikuro-runtime/wasi-preview2",
    "saikuro-exec/no_std",
    "saikuro-random/no_std",
    "dep:saikuro-client",
    "saikuro-client/no_std",
]
arm = [
    "embedded",
    "dep:cortex-m-rt",
    "dep:cortex-m-semihosting",
    "dep:cortex-m",
    "dep:panic-semihosting",
]
riscv = [
    "embedded",
    "dep:riscv-rt",
    "dep:riscv",
]
sqlite = ["saikuro-storage/sqlite"]
flash = ["saikuro-storage/flash"]
adapter = ["dep:saikuro", "dep:saikuro-c", "saikuro-c/native", "saikuro/native"]

[lints.rust]
# Only the embedded targets set `saikuro_test_capacity`; register the cfg so `rustc --check-cfg` stays quiet.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(saikuro_test_capacity, values("small", "rpx-class", "m33-class"))'] }

[dependencies]
# Saikuro core crates
saikuro-core = { workspace = true }
saikuro-event = { workspace = true }
saikuro-schema = { workspace = true }
saikuro-router = { workspace = true }
saikuro-transport = { workspace = true }
saikuro-runtime = { workspace = true }
saikuro-exec = { workspace = true }
saikuro-storage = { workspace = true, default-features = false }
saikuro-random = { workspace = true }
saikuro-codegen = { workspace = true }
saikuro-net = { workspace = true, optional = true }
saikuro-client = { workspace = true, optional = true }
saikuro = { workspace = true, optional = true }
saikuro-c = { path = "../Build/adapters/c", default-features = false, optional = true }

# External, target-agnostic
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
portable-atomic = { workspace = true }
portable-atomic-util = { workspace = true }
heapless = { workspace = true }

# wasm (wasm runner)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wasm-bindgen-test = { workspace = true, optional = true }

# Embedded / QEMU
cortex-m-rt = { workspace = true, optional = true }
cortex-m-semihosting = { workspace = true, optional = true }
cortex-m = { workspace = true, optional = true }
panic-semihosting = { workspace = true, optional = true }
riscv-rt = { workspace = true, optional = true }
riscv = { workspace = true, optional = true }
critical-section = { workspace = true }
embassy-time-driver = { workspace = true }
spin = { workspace = true }
linked_list_allocator = { workspace = true }
embedded-storage-async = { workspace = true }
embedded-io-async = { workspace = true }