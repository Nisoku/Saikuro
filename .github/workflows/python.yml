name: Python

on:
  push:
    branches: ["main"]
    paths:
      - "Build/adapters/python/**"
      - "tools/xtask/**"
      - "tools/tools.toml"
      - "Justfile"
      - "Justfile.d"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "Build/adapters/python/**"
      - "tools/xtask/**"
      - "tools/tools.toml"
      - "Justfile"
      - "Justfile.d"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format + lint + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Cargo.toml
      - name: Setup xtask deps
        run: cargo xtask setup
      - name: Adapter setup
        run: cargo xtask lang python setup
      - name: Check
        run: cargo xtask lang python check
