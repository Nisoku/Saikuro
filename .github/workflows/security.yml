name: Security Audit

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "Build/adapters/typescript/package-lock.json"
      - "Build/adapters/typescript/package.json"
      - "Build/adapters/csharp/**"
      - "tools/tools.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "Build/adapters/typescript/package-lock.json"
      - "Build/adapters/typescript/package.json"
      - "Build/adapters/csharp/**"
      - "tools/tools.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Nightly on Mondays at 07:00 UTC
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit (workspace + rust adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Setup xtask deps
        run: cargo xtask setup
      - name: Run audit
        run: cargo xtask audit
  deny:
    name: cargo deny (licenses, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Setup xtask deps
        run: cargo xtask setup
      - name: Run deny
        run: cargo xtask deny
  npm:
    name: npm audit (TypeScript adapter + web demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Build/adapters/typescript/package-lock.json
      - name: npm audit (TypeScript adapter)
        run: npm audit
        working-directory: Build/adapters/typescript
      - name: npm audit (web demo)
        run: npm audit
        working-directory: Demo
