name: autofix.ci

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.c"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.hpp"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.toml"
      - "**/*.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pyproject.toml"
      - "**/packages.lock.json"
  push:
    branches: ["main"]

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.0"

      # Dependency setup doubles as lockfile repair
      - name: Set up language dependencies
        run: |
          cargo xtask lang python setup
          cargo xtask lang type-script setup
          cargo xtask lang c-sharp setup
          cargo xtask lang demo setup

      - name: Format every language
        run: cargo xtask format

      # Re-resolving each workspace repairs Dependabot-edited changes; 
      # cargo leaves consistent lockfiles byte-identical, so healthy PRs produce no diff.
      - name: Sync cargo lockfiles
        run: |
          cargo fetch
          for dir in Demo/wasm/c Demo/wasm/cpp Demo/wasm/runtime Demo/wasm/rust Examples/rust; do
            cargo fetch --manifest-path "$dir/Cargo.toml"
          done

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
