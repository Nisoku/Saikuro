# Deploy the static web demo to GH Pages.
name: GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Demo/**"
      - "Docs/**"
      - "Build/adapters/**"
      - "Build/crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "Justfile.d"
      - ".github/workflows/static.yml"
  pull_request:
    paths:
      - "Demo/**"
      - "Docs/**"
      - "Build/adapters/**"
      - "Build/crates/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "Justfile.d"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Cargo.toml
      - name: Setup xtask deps
        run: cargo xtask setup
      - name: Build web demo
        run: cargo xtask demo build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Demo/dist

  deploy:
    name: Deploy demo to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
