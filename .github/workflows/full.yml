name: Full

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all:
    name: All checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: taiki-e/install-action@just
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Cargo.toml
      - name: Setup xtask deps
        run: cargo xtask setup
      - name: Rust adapter gate (format, lint, native test)
        run: cargo xtask lang rust check
      - name: Native engine suite
        run: cargo xtask test native
      - name: Python adapter gate
        run: cargo xtask lang python check
      - name: Setup TypeScript adapter
        run: cargo xtask lang type-script setup
      - name: TypeScript adapter gate
        run: cargo xtask lang type-script check
      - name: C# adapter gate
        run: cargo xtask lang c-sharp check
      - name: C adapter gate
        run: cargo xtask lang c check
      - name: C++ adapter gate
        run: cargo xtask lang cpp check
      - name: Gates (deny, audit, geiger, typos, spellcheck, deadlinks)
        run: |
          cargo xtask deny
          cargo xtask audit
          cargo xtask geiger
          cargo xtask typos
          cargo xtask spellcheck
          cargo xtask deadlinks
      - name: Setup demo app
        run: cargo xtask lang demo setup
      - name: Web demo build
        run: cargo xtask lang demo build
      - name: Web demo check
        run: cargo xtask lang demo check
