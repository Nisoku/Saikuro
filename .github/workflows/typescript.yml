name: TypeScript

on:
  push:
    branches: ["main"]
    paths:
      - "Build/adapters/typescript/**"
      - "tools/xtask/**"
      - "tools/tools.toml"
      - "Justfile"
      - "Justfile.d"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "Build/adapters/typescript/**"
      - "tools/xtask/**"
      - "tools/tools.toml"
      - "Justfile"
      - "Justfile.d"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format + lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Build/adapters/typescript/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Cargo.toml
      - name: Setup xtask deps
        run: cargo xtask setup
      - name: Adapter setup
        run: cargo xtask lang typescript setup
      - name: Check
        run: cargo xtask lang typescript check
