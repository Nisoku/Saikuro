[workspace]
resolver = "2"
members = [
    "Build/crates/saikuro-core",
    "Build/crates/saikuro-event",
    "Build/crates/saikuro-schema",
    "Build/crates/saikuro-transport",
    "Build/crates/saikuro-storage",
    "Build/crates/saikuro-router",
    "Build/crates/saikuro-runtime",
    "Build/crates/saikuro-exec",
    "Build/crates/saikuro-net",
    "Build/crates/saikuro-random",
    "Build/crates/saikuro-codegen",
    "Build/crates/saikuro-client",
    "Build/adapters/rust",
    "Build/adapters/c",
    "Tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NellowTCS"]
license = "Apache-2.0"
repository = "https://github.com/Nisoku/Saikuro"
rust-version = "1.82"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = [
    "alloc",
] }
messagepack-serde = { version = "0.2.4", default-features = false, features = [
    "alloc",
] }
bytes = { version = "1.12", default-features = false, features = [
    "extra-platforms",
] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"
pin-project-lite = "0.2"

uuid = { version = "1.23", default-features = false }

getrandom = { version = "0.3", default-features = false }
chacha20 = { version = "0.9", default-features = false }
portable-atomic = { version = "1", default-features = false, features = [
    "fallback",
    "critical-section",
] }
portable-atomic-util = { version = "0.2", default-features = false, features = [
    "alloc",
] }

rand_core = { version = "0.10", default-features = false }

heapless = { version = "0.8", default-features = false, features = ["serde"] }

serde_with = "3.0"

strum = { version = "0.28", default-features = false, features = ["derive"] }

tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }

embassy-sync = { version = "0.7", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-net = { version = "0.8", default-features = false }
embedded-storage-async = { version = "0.4", default-features = false }
sequential-storage = { version = "8", default-features = false, features = [
    "alloc",
] }

thiserror = { version = "2", default-features = false }
anyhow = "1.0"

dashmap = "7.0.0-rc2"
parking_lot = "0.12"
spin = { version = "0.12", default-features = false, features = [
    "mutex",
    "spin_mutex",
    "rwlock",
    "portable-atomic",
] }

chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "wasmbind",
] }

# Tokio
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }

# Embassy executor
embassy-executor = { version = "0.10", default-features = false }
embassy-net-driver-channel = "0.4"
critical-section = { version = "1" }
embassy-time-driver = { version = "0.2", default-features = false }

# WASM
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = "0.3.105"
wasm-bindgen-test = "0.3.78"
send_wrapper = "0.6"
web-time = { version = "1.1.0", default-features = false }

# Embedded
embedded-io-async = { version = "0.7", default-features = false }
linked_list_allocator = { version = "0.10", default-features = false }
cortex-m-rt = { version = "0.7", default-features = false }
cortex-m-semihosting = { version = "0.6", default-features = false }
cortex-m = { version = "0.7", default-features = false, features = [
    "critical-section-single-core",
] }
panic-semihosting = { version = "0.7", default-features = false }
riscv-rt = { version = "0.18", default-features = false }
riscv = { version = "0.12", default-features = false, features = [
    "critical-section-single-hart",
] }

# WASM Alloc
talc = { version = "4", default-features = false, features = ["lock_api"] }

# WebSocket
tokio-tungstenite = { version = "0.30", default-features = false }

# QUIC
s2n-quic = { version = "1", default-features = false, features = [
    "provider-tls-rustls",
    "provider-address-token-default",
] }
embedded-websocket = { version = "0.9", default-features = false }
rand_core_06 = { package = "rand_core", version = "0.6", default-features = false }

# Storage backends
sled = "0.34"
graphitesql = { version = "0.1.7", default-features = false }
wit-bindgen = "0.46"
wasi = "0.14"
wasip1 = "1"

# Futures
futures-executor = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Internal crates
saikuro-core = { path = "Build/crates/saikuro-core", default-features = false }
saikuro-schema = { path = "Build/crates/saikuro-schema", default-features = false }
saikuro-storage = { path = "Build/crates/saikuro-storage", default-features = false }
saikuro-transport = { path = "Build/crates/saikuro-transport", default-features = false }
saikuro-router = { path = "Build/crates/saikuro-router", default-features = false }
saikuro-runtime = { path = "Build/crates/saikuro-runtime", default-features = false }
saikuro-codegen = { path = "Build/crates/saikuro-codegen", default-features = false }
saikuro-exec = { path = "Build/crates/saikuro-exec", default-features = false }
saikuro-random = { path = "Build/crates/saikuro-random", default-features = false }
saikuro-event = { path = "Build/crates/saikuro-event", default-features = false }
saikuro = { path = "Build/adapters/rust", default-features = false }

# TODO: waiting for release of `embassy-time` 
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "73b44d7e867a371d0870a84624fea66a8b00f713" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "73b44d7e867a371d0870a84624fea66a8b00f713" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "73b44d7e867a371d0870a84624fea66a8b00f713" }

# Forked graphitesql with open_memory_with_page_size (adds a tunable page
# size for in-memory databases on memory-constrained targets).
graphitesql = { path = "vendor/graphitesql" }

[profile.qemu]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.qemu-debug]
inherits = "qemu"
strip = "none"
debug = true

