[workspace]
resolver = "2"
members = [
    "crates/saikuro-core",
    "crates/saikuro-schema",
    "crates/saikuro-storage",
    "crates/saikuro-transport",
    "crates/saikuro-router",
    "crates/saikuro-runtime",
    "crates/saikuro-exec",
    "crates/saikuro-random",
    "crates/saikuro-codegen",
    "adapters/c",
    "adapters/rust",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NellowTCS"]
license = "Apache-2.0"
repository = "https://github.com/Nisoku/Saikuro"
rust-version = "1.75"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
serde_bytes = "0.11"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
bytes = "1.7"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"
pin-project-lite = "0.2"

# UUID: default-features off so the crate stays no_std
uuid = { version = "1.23.2", default-features = false }

# Randomness: saikuro-random selects the backend via its own features
getrandom = { version = "0.3.1", default-features = false }

# Deterministic DRBG backend for saikuro-random
# Kept no_std (no default features).
chacha20 = { version = "0.9", default-features = false }

# Atomics that work on MCU targets without native 64-bit (or any) atomics
# (riscv32imc, thumbv6m). `fallback` provides the 64-bit ops on 32-bit-CAS
# targets (riscv32imac); `critical-section` covers targets with no atomics at
# all. Native instructions are still used where available.
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }

# Fixed-capacity collections for no_std builds. `BTreeMap` does not exist in
# heapless. IndexMap/IndexSet give deterministic (insertion-ordered) maps with a
# compile-time capacity and a serde impl that errors on overflow.
# heapless 0.7 is unusable here: its FnvIndexMap keys must implement the
# hash32::Hash trait, which `String` does not. 0.8 keys use the standard
# `Hash` trait (foldhash backend, no_std-safe).
heapless = { version = "0.8", default-features = false, features = ["serde"] }

# Duration / utility serde helpers
serde_with = "3.0"

# Enum string conversion
strum = { version = "0.28.0", features = ["derive"] }

# Logging / tracing: tracing itself is wasm-safe; the subscriber is not
# used directly from WASM so it only appears in crates that explicitly need it.
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Embedded async runtime (embassy) for no_std MCU targets
embassy-sync    = { version = "0.6", default-features = false }
embassy-time    = { version = "0.3", default-features = false }
embassy-futures = { version = "0.1", default-features = false }

# Error handling:  both are wasm-safe
thiserror = { version = "2.0", default-features = false }
anyhow = "1.0"

# Concurrency: dashmap and parking_lot are wasm-safe for single-threaded WASM i think
dashmap = "6.1"
parking_lot = "0.12"

# Spinlocks backing the saikuro-core::sync facade on no_std (MCU) builds.
# `portable-atomic` makes them work on targets without native atomics
# (thumbv6m); native instructions are still used where available.
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "portable-atomic"] }

# Time: chrono is wasm-safe when 'wasmbind' feature is enabled
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Internal crates
saikuro-core      = { path = "crates/saikuro-core" }
saikuro-schema    = { path = "crates/saikuro-schema" }
saikuro-storage   = { path = "crates/saikuro-storage", default-features = false }
saikuro-transport = { path = "crates/saikuro-transport", default-features = false }
saikuro-router    = { path = "crates/saikuro-router", default-features = false }
saikuro-runtime   = { path = "crates/saikuro-runtime", default-features = false }
saikuro-codegen   = { path = "crates/saikuro-codegen" }
saikuro-exec      = { path = "crates/saikuro-exec", default-features = false }
saikuro-random    = { path = "crates/saikuro-random", default-features = false }
saikuro           = { path = "adapters/rust", default-features = false }
