[workspace]
resolver = "2"
members = [
    "crates/saikuro-core",
    "crates/saikuro-event",
    "crates/saikuro-schema",
    "crates/saikuro-transport",
    "crates/saikuro-storage",
    "crates/saikuro-router",
    "crates/saikuro-runtime",
    "crates/saikuro-exec",
    "crates/saikuro-net",
    "crates/saikuro-random",
    "crates/saikuro-codegen",
    "adapters/c",
    "adapters/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NellowTCS"]
license = "Apache-2.0"
repository = "https://github.com/Nisoku/Saikuro"
rust-version = "1.75"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0", default-features = false }
serde_bytes = { version = "0.11", default-features = false, features = [
    "alloc",
] }
messagepack-serde = { version = "0.2.4", default-features = false, features = [
    "alloc",
] }
rmp-serde = "1.3"
bytes = "1.12"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"
pin-project-lite = "0.2"

uuid = { version = "1.23", default-features = false }

getrandom = { version = "0.3", default-features = false }
chacha20 = { version = "0.9", default-features = false }
portable-atomic = { version = "1", default-features = false, features = [
    "fallback",
    "critical-section",
] }

rand_core = { version = "0.9", default-features = false }

heapless = { version = "0.8", default-features = false, features = ["serde"] }

serde_with = "3.0"

strum = { version = "0.28", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }

embassy-sync = { version = "0.6", default-features = false }
embassy-time = { version = "0.3", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-net = { version = "0.5", default-features = false }
embedded-storage-async = { version = "0.4", default-features = false }
sequential-storage = { version = "8", default-features = false, features = ["alloc"] }

thiserror = { version = "2", default-features = false }
anyhow = "1.0"

dashmap = "7.0.0-rc2"
parking_lot = "0.12"
spin = { version = "0.12", default-features = false, features = [
    "mutex",
    "spin_mutex",
    "rwlock",
    "portable-atomic",
] }

chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Tokio
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }

# Embassy executor
embassy-executor = { version = "0.6", default-features = false }
embassy-net-driver-channel = "0.3"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
fluvio-wasm-timer = "0.2"
send_wrapper = "0.6"
wasm-bindgen-test = "0.3"

# Embedded IO
embedded-io-async = { version = "0.7", default-features = false }

# WebSocket
tokio-tungstenite = { version = "0.30", default-features = false }

# Storage backends
sled = "0.34"
graphitesql = "0.1.6"
wit-bindgen = "0.46"
wasi = "0.14"

# Futures
futures-executor = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
saikuro-core = { path = "crates/saikuro-core", default-features = false }
saikuro-schema = { path = "crates/saikuro-schema", default-features = false }
saikuro-storage = { path = "crates/saikuro-storage", default-features = false }
saikuro-transport = { path = "crates/saikuro-transport", default-features = false }
saikuro-router = { path = "crates/saikuro-router", default-features = false }
saikuro-runtime = { path = "crates/saikuro-runtime", default-features = false }
saikuro-codegen = { path = "crates/saikuro-codegen" }
saikuro-exec = { path = "crates/saikuro-exec", default-features = false }
saikuro-random = { path = "crates/saikuro-random", default-features = false }
saikuro-event = { path = "crates/saikuro-event", default-features = false }
saikuro = { path = "adapters/rust", default-features = false }
