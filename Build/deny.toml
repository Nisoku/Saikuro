# cargo-deny configuration for the Saikuro workspace.
#
# Run:  cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluate the full dependency graph, including dev-dependencies.
all-features = true

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------

[licenses]
# Confidence threshold for license detection (0.0 - 1.0).
confidence-threshold = 0.8

# Every license in the dependency tree must match one of these.  The list
# covers the set used by the workspace's direct and transitive dependencies.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "LicenseRef-SQLite-Blessing",
]

# Crates whose LICENSE files are not machine-readable but are known-good.
# Hash values are cargo-deny's xxhash32 of the normalized LICENSE file
# (generated by running the license check and reading the reported value).
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0x0d99693a }]

# Vendor/local graphitesql licenses itself under the SQLite blessing (public
# domain), which has no SPDX ID.
[[licenses.clarify]]
name = "graphitesql"
expression = "LicenseRef-SQLite-Blessing"
license-files = [{ path = "LICENSE", hash = 0x2deec6dd }]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------

[bans]
# Warn on duplicate crate versions; specific exceptions are listed in skip.
multiple-versions = "warn"

# Crates that must never appear in the dependency tree.
deny = [
    # openssl: requires a system library; use rustls instead.
    { name = "openssl" },
    { name = "openssl-sys" },
]

# Allow known-duplicate crates from transitive dependencies.
skip = [
    # tungstenite -> rand 0.8 -> rand_core -> getrandom 0.2
    # tungstenite -> rand 0.10 -> getrandom 0.4
    # saikuro-random -> getrandom 0.3
    # All pins except 0.3 are external (from the tungstenite/rand WebSocket
    # stack); nothing in the workspace controls them.
    { name = "getrandom" },
]

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------

[advisories]
# Fetch the RustSec advisory database and deny any crates with known
# vulnerabilities.
version = 2
# Unmaintained/deprecated notices with no safe upgrade, not on our side.
ignore = [
    "RUSTSEC-2023-0089",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2026-0110",
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

[sources]
# Only allow crates from crates.io and local paths.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/embassy-rs/embassy"]
