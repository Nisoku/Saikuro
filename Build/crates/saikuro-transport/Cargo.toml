[package]
name = "saikuro-transport"
description = "Transport layer for Saikuro: in-memory, Unix socket, TCP, WASI, and WebSocket backends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "transport", "async"]

[lib]
path = "lib.rs"

[features]
default = ["std", "native", "tcp", "ws"]
std = []
native = [
    "std",
    "saikuro-core/native",
    "saikuro-net/native",
    "saikuro-exec/native",
    "saikuro-event/native",
    "dep:tokio-tungstenite",
]
no_std = ["saikuro-core/no_std", "saikuro-net/no_std", "saikuro-exec/no_std", "saikuro-event/no_std"]
wasm = [
    "saikuro-core/wasm",
    "saikuro-net/wasm",
    "saikuro-exec/wasm",
    "saikuro-event/wasm",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:send_wrapper",
    "dep:wasm-bindgen-futures",
]
embedded = [
    "saikuro-core/embedded",
    "saikuro-exec/embedded",
    "saikuro-event/embedded",
    "dep:embedded-io-async",
    "dep:embassy-sync",
]
tcp = []
tcp-net = ["dep:saikuro-net", "saikuro-net/embedded"]
unix = []
ws = ["ws-native"]
ws-native = ["tokio-tungstenite?/connect", "tokio-tungstenite?/handshake"]
ws-wasm = []
ws-wasi = ["dep:embedded-websocket", "dep:rand_core_06", "dep:getrandom", "wasi-tcp", "ws"]
wasm-host = ["wasm"]
wasi-tcp = ["saikuro-exec/no_std", "dep:embedded-io-async"]
wasi-host = ["no_std", "saikuro-exec/no_std", "wasi-tcp"]
wasi-preview2 = ["dep:wasi"]
wasi-preview1 = ["dep:wasip1"]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }
saikuro-net = { path = "../saikuro-net", default-features = false, optional = true }
saikuro-exec = { path = "../saikuro-exec", default-features = false }
saikuro-random = { path = "../saikuro-random", default-features = false }
saikuro-event = { path = "../saikuro-event", default-features = false }
serde = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true, default-features = false, features = ["async-await", "alloc"] }
pin-project-lite = { workspace = true }
portable-atomic-util = { workspace = true }
portable-atomic = { workspace = true }
thiserror = { workspace = true }
embedded-io-async = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
embedded-websocket = { workspace = true, optional = true }
rand_core_06 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

send_wrapper = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "BroadcastChannel",
    "Crypto",
    "MessageEvent",
    "WebSocket",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "BinaryType",
] }

wasi = { workspace = true, optional = true }
wasip1 = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, default-features = false, features = ["async-await", "alloc", "executor"] }
