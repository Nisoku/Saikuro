[package]
name = "saikuro-transport"
description = "Transport layer for Saikuro: in-memory, Unix socket, TCP, and WebSocket backends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "transport", "async"]

[features]
default = ["std", "native-transport"]
std = []
embassy = ["saikuro-exec/embassy-runtime", "saikuro-core/embedded"]
embedded-io = ["dep:embedded-io-async"]
native-transport = ["std", "saikuro-exec/tokio-runtime", "saikuro-core/std"]
ws-transport = []
wasm-runtime = [
    "std",
    "saikuro-core/std-no-os",
    "saikuro-exec/wasm-runtime",
    "saikuro-random/wasm",
]
native-ws = ["ws-transport", "std", "saikuro-exec/tokio-runtime", "saikuro-core/std", "tokio-tungstenite"]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }

serde       = { workspace = true }
bytes       = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
pin-project-lite = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
saikuro-exec = { workspace = true, default-features = false }
saikuro-random = { workspace = true, default-features = false }
embedded-io-async = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "BroadcastChannel",
    "Crypto",
    "MessageEvent",
    "WebSocket",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "BinaryType",
] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
futures = { workspace = true, features = ["executor"] }
