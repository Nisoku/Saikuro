[package]
name = "saikuro-transport"
description = "Transport layer for Saikuro: in-memory, Unix socket, TCP, WASI, and WebSocket backends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "transport", "async"]

[lib]
path = "lib.rs"

[features]
default = ["std", "native", "tcp", "ws"]
std = []
native = [
    "std",
    "saikuro-core/native",
    "saikuro-net/native",
    "saikuro-exec/native",
    "dep:tokio-tungstenite",
]
no_std = ["saikuro-core/no_std", "saikuro-net/no_std", "saikuro-exec/no_std"]
wasm = ["saikuro-core/wasm", "saikuro-net/wasm", "saikuro-exec/wasm"]
embedded = [
    "saikuro-core/embedded",
    "saikuro-net/embedded",
    "saikuro-exec/embedded",
    "dep:embedded-io-async",
    "dep:embassy-sync",
]

tcp = []
unix = []
ws = []
wasm-host = ["wasm"]
wasi-tcp = ["no_std", "saikuro-exec/no_std", "dep:embedded-io-async"]
wasi-host = ["no_std", "saikuro-exec/no_std", "wasi-tcp"]
wasi-preview2 = ["dep:wasi"]
wasi-preview1 = []

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }
saikuro-net = { path = "../saikuro-net", default-features = false }
saikuro-exec = { path = "../saikuro-exec", default-features = false }
saikuro-random = { path = "../saikuro-random", default-features = false }
serde = { workspace = true }
bytes = { workspace = true, default-features = false }
async-trait = { workspace = true }
futures = { workspace = true, default-features = false, features = ["async-await", "alloc"] }
pin-project-lite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, default-features = false, features = ["log", "attributes"] }
embedded-io-async = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", feature = "wasm"))'.dependencies]
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "BroadcastChannel",
    "Crypto",
    "MessageEvent",
    "WebSocket",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "BinaryType",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = { workspace = true, optional = true }
wasip1 = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
futures = { workspace = true, default-features = false, features = ["async-await", "alloc", "executor"] }
