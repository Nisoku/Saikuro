[package]
name = "saikuro-log"
description = "Logging types and sinks for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "logging", "log"]

[lib]
path = "lib.rs"

[features]
default = ["std", "native", "stderr", "null", "filter"]
std = []
native = ["std"]
no_std = []
wasm = []
embedded = ["dep:embedded-io-async", "dep:spin"]
stderr = ["native"]
tracing = ["native", "dep:tracing"]
console = ["wasm", "dep:web-sys"]
serial = ["embedded"]
collector = ["dep:spin"]
null = []
filter = []

[dependencies]
saikuro-core = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
heapless = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["console"] }
embedded-io-async = { workspace = true, optional = true }
spin = { workspace = true, optional = true }
