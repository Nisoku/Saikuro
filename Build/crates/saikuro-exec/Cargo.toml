[package]
name = "saikuro-exec"
description = "Execution and concurrency facade for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["std", "native"]
std = []
native = ["std", "dep:tokio", "tokio/full", "dep:tokio-util", "futures/std"]
no_std = [
    "dep:embassy-executor",
    "embassy-executor/executor-thread",
    "embassy-executor/platform-spin",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
    "dep:critical-section",
]
wasm = [
    "dep:embassy-executor",
    "embassy-executor/executor-thread",
    "embassy-executor/platform-wasm",
    "dep:embassy-sync",
    "dep:embassy-time",
    "embassy-time/wasm",
    "embassy-time/generic-queue-32",
    "dep:embassy-futures",
    "futures/async-await",
    "dep:critical-section",
    "dep:wasm-bindgen-futures",
    "dep:fluvio-wasm-timer",
]
embedded = [
    "dep:embassy-executor",
    "embassy-executor/executor-thread",
    "embassy-executor/platform-spin",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
    "dep:critical-section",
]
embassy-test = ["embedded", "embassy-time/std", "embassy-time/generic-queue-32"]

[dependencies]
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

futures = { workspace = true }

embassy-executor = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true, features = [
    "medium-ip",
    "proto-ipv4",
    "tcp",
    "udp",
] }
wasm-bindgen-futures = { workspace = true, optional = true }
fluvio-wasm-timer = { workspace = true, optional = true }
portable-atomic-util = { workspace = true }
portable-atomic = { workspace = true }
