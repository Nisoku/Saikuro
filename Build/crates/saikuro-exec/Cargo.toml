[package]
name = "saikuro-exec"
description = "Execution and concurrency facade for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tokio-runtime"]
tokio-runtime = ["dep:tokio", "tokio/full", "dep:tokio-util", "futures/std"]
wasm-runtime = ["dep:tokio", "wasm-bindgen-futures", "fluvio-wasm-timer", "futures/std"]
embassy-runtime = [
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
]
embassy-test = [
    "embassy-runtime",
    "embassy-time/std",
    "embassy-time/generic-queue",
]

[dependencies]
tokio      = { version = "1.52.3", default-features = false, features = ["macros"], optional = true }
tokio-util = { version = "0.7.18", features = ["codec"], optional = true }

futures = { workspace = true }
wasm-bindgen-futures = { version = "0.4.71", optional = true }
fluvio-wasm-timer = { version = "0.2.5", optional = true }

embassy-sync    = { workspace = true, optional = true }
embassy-time    = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }

[dev-dependencies]
futures-executor = "0.3"
