[package]
name = "saikuro-exec"
description = "Execution and concurrency facade for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tokio-runtime"]
tokio-runtime = ["dep:tokio", "tokio/full", "dep:tokio-util", "futures/std"]
wasm-runtime = ["dep:tokio", "wasm-bindgen-futures", "fluvio-wasm-timer", "futures/std"]
embassy-runtime = [
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
]
embassy-test = [
    "embassy-runtime",
    "embassy-time/std",
    "embassy-time/generic-queue",
]
net = ["dep:embassy-net"]

[dependencies]
tokio      = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

futures = { workspace = true }
wasm-bindgen-futures = { workspace = true, optional = true }
fluvio-wasm-timer = { workspace = true, optional = true }

embassy-sync    = { workspace = true, optional = true }
embassy-time    = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-net     = { workspace = true, optional = true, features = [
    "medium-ip",
    "proto-ipv4",
    "tcp",
    "udp",
] }

[dev-dependencies]
embassy-executor = { workspace = true }
embassy-net-driver-channel = { workspace = true }
futures-executor = { workspace = true }
