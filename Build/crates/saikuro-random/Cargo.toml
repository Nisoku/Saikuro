[package]
name = "saikuro-random"
description = "Randomness and entropy facade for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "random", "rng"]

[features]
default = ["std", "native"]
std = ["rand_core/std"]
native = ["std", "getrandom", "getrandom/std"]
no_std = ["getrandom"]
wasm = ["getrandom", "getrandom/wasm_js"]
embedded = []

[dependencies]
getrandom = { workspace = true, optional = true }
chacha20 = { workspace = true }
portable-atomic = { workspace = true }
rand_core = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chacha20 = { workspace = true }
