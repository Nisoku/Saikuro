[package]
name = "saikuro-storage"
description = "Storage backend abstraction for Saikuro: agnostic file system and key-value access"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "storage", "key-value"]

[features]
default = ["std", "native-storage"]
std = []
custom = ["saikuro-core/custom"]
drbg = ["saikuro-core/drbg"]
native-storage = [
    "std",
    "inmemory",
    "local-storage",
    "session-storage",
    "saikuro-core/std",
    "saikuro-exec/tokio-runtime",
]
inmemory = ["std", "dashmap"]
local-storage = ["inmemory"]
session-storage = ["inmemory"]
fs-storage = ["std", "dep:tokio", "saikuro-core/std", "saikuro-exec/tokio-runtime"]
sled-storage = ["std", "dep:tokio", "dep:sled", "saikuro-core/std", "saikuro-exec/tokio-runtime"]
sqlite-storage = ["std", "dep:tokio", "dep:rusqlite", "saikuro-core/std", "saikuro-exec/tokio-runtime"]
wasm-storage = [
    "std",
    "inmemory",
    "local-storage",
    "session-storage",
    "saikuro-core/std-no-os",
    "saikuro-exec/wasm-runtime",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
fs-access = ["wasm-storage"]
flash-storage = ["dep:embedded-storage-async"]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

dashmap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sled = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
embedded-storage-async = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Blob",
    "BroadcastChannel",
    "DomException",
    "DomStringList",
    "File",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "MessageEvent",
    "Navigator",
    "Storage",
    "StorageManager",
    "Window",
] }

[dev-dependencies]
saikuro-exec = { workspace = true, features = ["tokio-runtime"] }
tracing-subscriber = { workspace = true }
futures-executor = { workspace = true }
embedded-storage-async = { workspace = true }

[[test]]
name = "flash"
required-features = ["flash-storage"]
