[package]
name = "saikuro-storage"
description = "Storage backend abstraction for Saikuro: agnostic file system and key-value access"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "storage", "key-value"]

[lib]
path = "lib.rs"

[features]
default = ["std", "native", "inmemory"]
std = ["saikuro-event/std"]

# Engine features.
native   = [
    "std",
    "dep:graphitesql",
    "graphitesql/std",
    "graphitesql/fts5",
    "dep:tokio",
    "saikuro-core/std",
    "saikuro-exec/native",
    "saikuro-event/native",
    "saikuro-event/std",
]
no_std   = [
    "sqlite",
    "saikuro-core/no_std",
    "saikuro-exec/no_std",
    "saikuro-event/no_std",
]
wasm     = [
    "sqlite",
    "graphitesql/wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "saikuro-core/wasm",
    "saikuro-exec/wasm",
    "saikuro-event/wasm",
]
embedded = [
    "sqlite",
    "dep:embedded-storage-async",
    "saikuro-core/embedded",
    "saikuro-exec/embedded",
    "saikuro-event/embedded",
]

wasi-component = ["no_std", "dep:wasi", "dep:wit-bindgen"]
wasi-preview1  = ["no_std"]
wasi-kv        = ["no_std"]

inmemory = ["std", "dashmap"]
fs    = ["native", "dep:tokio", "saikuro-core/std"]
sled  = ["native", "dep:tokio", "dep:sled", "saikuro-core/std"]
sqlite = ["dep:graphitesql", "graphitesql/fts5"]
flash = [
    "embedded",
    "dep:embedded-storage-async",
    "dep:sequential-storage",
    "saikuro-event/embedded",
    "saikuro-core/embedded",
    "saikuro-exec/embedded",
]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }
saikuro-event = { path = "../saikuro-event", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

dashmap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "rt", "rt-multi-thread"] }
sled = { workspace = true, optional = true }
spin = { workspace = true }
graphitesql = { workspace = true, optional = true }
wit-bindgen = { workspace = true, optional = true }
wasi = { workspace = true, optional = true }
embedded-storage-async = { workspace = true, optional = true }
sequential-storage = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Blob",
    "BroadcastChannel",
    "DomException",
    "DomStringList",
    "File",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "MessageEvent",
    "Navigator",
    "Storage",
    "StorageManager",
    "Window",
] }

[dev-dependencies]
saikuro-exec = { workspace = true, features = ["native"] }
futures-executor = { workspace = true }
embedded-storage-async = { workspace = true }
