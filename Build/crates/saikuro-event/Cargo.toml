[package]
name = "saikuro-event"
description = "Unified error taxonomy, structured logging, and value types for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "error", "logging"]

[features]
default = ["std", "native", "stderr", "null", "filter"]
std = []
native = ["std"]
no_std = []
wasm = ["dep:wasm-bindgen"]
embedded = ["dep:embedded-io-async", "dep:spin"]
stderr = ["native"]
tracing = ["native", "dep:tracing"]
console = ["wasm", "dep:web-sys"]
serial = ["embedded"]
collector = ["dep:spin"]
null = []
filter = []

[lib]
path = "lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
serde_bytes = { workspace = true }
heapless = { workspace = true }
thiserror = { workspace = true, default-features = false }
strum = { workspace = true }
messagepack-serde = { workspace = true }
getrandom = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["console"] }
embedded-io-async = { workspace = true, optional = true }
spin = { workspace = true, optional = true }
