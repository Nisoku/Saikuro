[package]
name = "saikuro-codegen"
description = "Binding generator: produce typed client/server stubs from a frozen Saikuro schema"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "codegen", "bindings"]

[lib]
path = "lib.rs"

[[bin]]
name = "saikuro-codegen"
path = "cli/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:anyhow", "dep:serde_json"]

[dependencies]
saikuro-core = { workspace = true, default-features = false }
saikuro-schema = { workspace = true }

thiserror = { workspace = true }
serde_json = { workspace = true, optional = true, default-features = false, features = [
    "alloc",
] }
anyhow = { workspace = true, optional = true }

clap = { workspace = true, optional = true }

[dev-dependencies]
