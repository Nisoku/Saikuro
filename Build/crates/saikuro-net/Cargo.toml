[package]
name = "saikuro-net"
description = "Networking and IO facade for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["std", "native"]
std = []
native = ["std", "dep:tokio", "tokio/full"]
no_std = [
    "dep:embassy-net",
    "embassy-net/{medium-ip,proto-ipv4,tcp,udp}",
    "dep:embedded-io-async",
]
embedded = [
    "dep:embassy-net",
    "embassy-net/{medium-ip,proto-ipv4,tcp,udp}",
    "dep:embedded-io-async",
]
wasm = []
embassy-test = ["embedded", "embassy-time/std", "embassy-time/generic-queue"]

[dependencies]
tokio = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
futures = { workspace = true }
