[package]
name = "saikuro-exec"
description = "Execution and concurrency facade for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["std", "native"]
std = []
native = ["std", "dep:tokio", "tokio/full", "dep:tokio-util", "futures/std"]
no_std = [
    "dep:embassy-executor",
    "embassy-executor/alloc",
    "embassy-executor/arch-spin",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
]
wasm = [
    "dep:embassy-executor",
    "embassy-executor/alloc",
    "embassy-executor/arch-wasm",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
]
embedded = [
    "dep:embassy-executor",
    "embassy-executor/arch-cortex-m",
    "embassy-executor/task-arena-size-4096",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embassy-futures",
    "futures/async-await",
]
embassy-test = ["embedded", "embassy-time/std", "embassy-time/generic-queue"]
net = ["dep:embassy-net"]

[dependencies]
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

futures = { workspace = true }

embassy-executor = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true, features = [
    "medium-ip",
    "proto-ipv4",
    "tcp",
    "udp",
] }

[target.'cfg(all(target_arch = "wasm32", feature = "wasm"))'.dependencies]
wasm-bindgen-futures = { workspace = true }
fluvio-wasm-timer = { workspace = true }
