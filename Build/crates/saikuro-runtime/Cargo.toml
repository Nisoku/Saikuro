[package]
name = "saikuro-runtime"
description = "The Saikuro runtime: orchestrates schema, transport, routing, and capability enforcement. Includes standalone server binary."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "runtime", "async"]

[[bin]]
name = "saikuro-runtime"
path = "src/main.rs"
required-features = ["native-transport"]

[features]
default = ["native-transport"]
native-transport = ["saikuro-transport/native-transport", "saikuro-exec/tokio-runtime"]
ws-transport = ["saikuro-transport/native-ws"]
wasm-runtime = [
    "saikuro-transport/wasm-runtime",
    "saikuro-exec/wasm-runtime",
    "saikuro-random/wasm",
]

[dependencies]
saikuro-core      = { path = "../saikuro-core", default-features = false }
saikuro-schema    = { workspace = true }
saikuro-transport = { workspace = true }
saikuro-router    = { workspace = true }
saikuro-exec      = { workspace = true, default-features = false }
saikuro-random    = { path = "../saikuro-random", default-features = false }

serde       = { workspace = true }
serde_json  = { workspace = true }
bytes       = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap     = { workspace = true }
parking_lot = { workspace = true }
serde_with  = { workspace = true }

anyhow      = { workspace = true }
clap        = { workspace = true, features = ["env"] }

[dev-dependencies]
