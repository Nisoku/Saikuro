[package]
name = "saikuro-core"
description = "Core protocol types, envelope model, and error definitions for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "rpc", "msgpack"]

[features]
default = ["std"]
std = ["saikuro-random/os"]
std-no-os = ["saikuro-random/wasm"]
custom = ["saikuro-random/custom"]
drbg = ["saikuro-random/drbg"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, default-features = false, features = [
    "alloc",
] }
serde_bytes = { workspace = true }
uuid = { workspace = true }
saikuro-random = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }
strum = { workspace = true }
heapless = { workspace = true }
spin = { workspace = true }
messagepack-serde = { workspace = true }
portable-atomic = { workspace = true }
