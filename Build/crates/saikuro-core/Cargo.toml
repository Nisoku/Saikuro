[package]
name = "saikuro-core"
description = "Core protocol types, envelope model, and error definitions for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "rpc", "msgpack"]

# The crate is always `no_std` + `alloc`. The default `std` feature adds the
# std-only conveniences (`std::io::Error` variant, stderr log sink) and selects
# the OS entropy backend; `std-no-os` is the same crate-level conveniences
# without the OS entropy backend, for targets that cannot reach it (wasm32);
# `custom` selects the caller-provided getrandom backend and `drbg` the
# deterministic chacha20 DRBG for bare-metal targets (see saikuro-random).
# `std` is mutually exclusive with `custom`/`drbg`.
[features]
default = ["std"]
std = ["saikuro-random/os"]
std-no-os = []
custom = ["saikuro-random/custom"]
drbg = ["saikuro-random/drbg"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, default-features = false, features = [
    "alloc",
] }
serde_bytes = { workspace = true }
uuid = { workspace = true }
saikuro-random = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
heapless = { workspace = true }
spin = { workspace = true }
messagepack-serde = { workspace = true }
