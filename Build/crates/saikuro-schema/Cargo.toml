[package]
name = "saikuro-schema"
description = "Schema registry, invocation validator, and capability enforcement for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "schema", "validation"]

[lib]
path = "lib.rs"

[features]
default = ["std", "native"]
std = []
native = ["std", "saikuro-core/native", "saikuro-exec/native", "saikuro-event/native"]
no_std = ["saikuro-core/no_std", "saikuro-exec/no_std", "saikuro-event/no_std"]
wasm = ["saikuro-core/wasm", "saikuro-exec/wasm", "saikuro-event/wasm"]
embedded = ["saikuro-core/embedded", "saikuro-exec/embedded", "saikuro-event/embedded"]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }
saikuro-exec = { path = "../saikuro-exec", default-features = false }
saikuro-event = { workspace = true, default-features = false }

thiserror = { workspace = true }
