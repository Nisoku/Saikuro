[package]
name = "saikuro-schema"
description = "Schema registry, invocation validator, and capability enforcement for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "schema", "validation"]

# This crate is always `no_std` + `alloc`
[features]
default = ["std"]
std = ["saikuro-core/std"]
custom = ["saikuro-core/custom"]
drbg = ["saikuro-core/drbg"]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }

# thiserror is already default-features-off at the workspace level.
thiserror = { workspace = true }
# tracing is declared directly so the `std` feature stays off; only the
# event macros are used (no `#[instrument]`).
tracing = { version = "0.1", default-features = false }
