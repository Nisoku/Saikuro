[package]
name = "saikuro-schema"
description = "Schema registry, invocation validator, and capability enforcement for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "schema", "validation"]

[lib]
path = "lib.rs"

[features]
default = ["std", "native"]
std = []
native = ["std", "saikuro-core/native"]
no_std = ["saikuro-core/no_std"]
wasm = ["saikuro-core/wasm"]
embedded = ["saikuro-core/embedded"]

[dependencies]
saikuro-core = { path = "../saikuro-core", default-features = false }

thiserror = { workspace = true }
