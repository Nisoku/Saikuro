[package]
name = "saikuro-router"
description = "Invocation router and provider registry for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "router", "rpc"]

[features]
default = ["std"]
std = ["saikuro-core/std", "saikuro-exec/tokio-runtime"]
embassy = ["saikuro-exec/embassy-runtime", "saikuro-core/embedded"]

[dependencies]
saikuro-core   = { path = "../saikuro-core", default-features = false }
saikuro-schema = { workspace = true, default-features = false }
saikuro-exec   = { workspace = true, default-features = false }
saikuro-log    = { workspace = true, default-features = false, features = ["tracing"] }

async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
saikuro-exec = { workspace = true }
tracing-subscriber = { workspace = true }
