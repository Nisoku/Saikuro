[package]
name = "saikuro-router"
description = "Invocation router and provider registry for Saikuro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ipc", "cross-language", "saikuro", "router", "rpc"]

[features]
default = ["std"]
std = ["saikuro-core/std", "saikuro-exec/tokio-runtime"]
embassy = ["saikuro-exec/embassy-runtime", "saikuro-core/drbg"]

[dependencies]
saikuro-core   = { path = "../saikuro-core", default-features = false }
saikuro-schema = { workspace = true, default-features = false }
saikuro-exec   = { workspace = true, default-features = false }

async-trait = { workspace = true }
thiserror   = { workspace = true }
# Atomics for sequence tracking that also work on MCU targets without native
# 64-bit CAS (thumbv7m); native instructions are used where available.
portable-atomic = { workspace = true }
# tracing is declared directly so the `std` feature stays off on MCU; the
# `attributes` feature is required by `#[instrument]` on `dispatch`.
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
