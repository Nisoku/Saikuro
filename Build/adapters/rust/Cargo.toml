[package]
name = "saikuro"
version = "0.1.0"
edition = "2021"
authors = ["NellowTCS"]
license = "Apache-2.0"
repository = "https://github.com/Nisoku/Saikuro"
description = "Rust adapter for the Saikuro runtime"
rust-version = "1.75"
keywords = ["ipc", "cross-language", "rpc", "msgpack", "saikuro"]
categories = ["network-programming", "asynchronous"]

[[bin]]
name = "saikuro-rust-schema"
path = "src/cli/saikuro_rust_schema.rs"
required-features = ["native"]

[features]
default = ["std", "native", "tcp", "unix", "ws", "storage", "inmemory"]
std = ["dep:dashmap"]
native = [
    "std",
    "saikuro-core/native",
    "saikuro-transport/native",
    "saikuro-exec/native",
    "saikuro-event/native",
    "saikuro-event/std",
    "storage",
    "saikuro-storage/native",
    "dep:anyhow",
    "dep:clap",
    "dep:syn",
]
wasm = [
    "saikuro-core/wasm",
    "saikuro-transport/wasm",
    "saikuro-transport/wasm-host",
    "saikuro-exec/wasm",
    "saikuro-event/wasm",
]
embedded = [
    "saikuro-core/embedded",
    "saikuro-transport/embedded",
    "saikuro-exec/embedded",
    "saikuro-event/embedded",
]
no_std = [
    "saikuro-core/no_std",
    "saikuro-transport/no_std",
    "saikuro-exec/no_std",
    "saikuro-event/no_std",
]
tcp  = ["saikuro-transport/tcp"]
unix = ["saikuro-transport/unix"]
ws   = ["saikuro-transport/ws"]
ws-wasi = ["saikuro-transport/ws-wasi"]
wasi-tcp = ["saikuro-transport/wasi-tcp"]
wasi-host = ["saikuro-transport/wasi-host"]
wasi-preview1 = ["saikuro-transport/wasi-preview1"]
wasi-preview2 = ["saikuro-transport/wasi-preview2"]
storage = ["saikuro-storage"]
inmemory = ["saikuro-storage/inmemory"]
storage-fs = ["saikuro-storage/fs"]
storage-sled = ["saikuro-storage/sled"]
storage-sqlite = ["saikuro-storage/sqlite-native"]
wasm-storage = ["saikuro-storage/wasm"]

[dependencies]
saikuro-core      = { path = "../../crates/saikuro-core", default-features = false }
saikuro-storage   = { path = "../../crates/saikuro-storage", default-features = false, optional = true }
saikuro-transport = { path = "../../crates/saikuro-transport", default-features = false }
saikuro-event     = { path = "../../crates/saikuro-event", default-features = false }

anyhow      = { workspace = true, optional = true }
serde_json  = { workspace = true, features = ["alloc"] }
bytes       = { workspace = true }
portable-atomic-util = { workspace = true, features = ["alloc"] }
saikuro-exec = { workspace = true, default-features = false }
futures     = { workspace = true, features = ["async-await"] }
async-trait = { workspace = true }
thiserror   = { workspace = true }
dashmap     = { version = "6.2.1", optional = true }
clap        = { version = "4.5", features = ["derive"], optional = true }
syn         = { version = "2.0", features = ["full"], optional = true }
