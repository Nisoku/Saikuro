# Saikuro Cargo config
#
# WASM tests need wasm-bindgen-cli (cargo install wasm-bindgen-cli):
#   cargo test -p saikuro-tests --target wasm32-unknown-unknown
#   wasm-pack test --headless --chrome Build/tests

# getrandom 0.3 picks its backend at compile time via the `getrandom_backend`
# cfg, so it's set per-target below.
#
# wasm32-unknown-unknown: no OS entropy, so pin the `wasm_js` backend.
# saikuro-random's `wasm` engine enables the matching cargo feature (wired
# through adapters/rust, saikuro-runtime, and saikuro-tests' wasm32 deps).
#
# WASI (preview1/preview2): the `no_std` engine uses getrandom's built-in WASI
# backend, picked automatically from the target triple. No cfg needed.
#
# Bare-metal MCU targets don't use getrandom at all. saikuro-random's
# `embedded` engine pulls entropy from an application-provided `EntropySource`
# via `init_from`, so there's no `__getrandom_v03_custom` symbol to link. The
# `custom` cfgs below only matter for direct getrandom usage and are inert for
# the embedded engine.
#
# Host targets: leave the cfg alone; getrandom uses the OS backend.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# Bare-metal targets (kept for direct getrandom usage; the embedded engine uses
# EntropySource instead):
#   riscv32imc-unknown-none-elf        ESP32-C3
#   thumbv6m-none-eabi                 RP2040
#   thumbv8m.main-none-eabihf          RP2350
[target.aarch64-unknown-none]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.riscv32imac-unknown-none-elf]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.riscv32imc-unknown-none-elf]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.thumbv6m-none-eabi]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.thumbv8m.main-none-eabihf]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]

