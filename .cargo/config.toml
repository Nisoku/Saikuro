# Saikuro Cargo config
#
# WASM tests need wasm-bindgen-cli (cargo install wasm-bindgen-cli).
#   cargo test -p saikuro-tests --target wasm32-unknown-unknown
#   wasm-pack test --headless --chrome Build/tests

# getrandom 0.3 picks its backend at compile time with the `getrandom_backend`
# cfg, so we set it per-target here.
#
# wasm32-unknown-unknown has no OS entropy, so we pin the `wasm_js` backend on
# every build for it. saikuro-random's `wasm` engine enables the matching
# cargo feature (threaded through adapters/rust, saikuro-runtime, and
# saikuro-tests' wasm32 deps).
#
# The `no_std` engine (WASI preview1/preview2) relies on getrandom's built-in
# WASI backend, selected automatically by the target triple -- no cfg needed.
#
# Bare-metal MCU targets no longer use getrandom at all: saikuro-random's
# `embedded` engine takes entropy from an application-provided `EntropySource`
# trait via `init_from`, so there is no `__getrandom_v03_custom` to link. The
# `custom` cfgs below are retained only for any direct getrandom usage and are
# inert for the embedded engine.
#
# Host targets: leave the cfg alone and let getrandom use its normal OS backend.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# Bare-metal targets (retained for direct getrandom usage; the embedded engine
# uses the EntropySource trait instead):
#   riscv32imc-unknown-none-elf        ESP32-C3
#   thumbv6m-none-eabi                 RP2040
#   thumbv8m.main-none-eabihf          RP2350
[target.aarch64-unknown-none]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.riscv32imac-unknown-none-elf]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.riscv32imc-unknown-none-elf]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.thumbv6m-none-eabi]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
[target.thumbv8m.main-none-eabihf]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]

